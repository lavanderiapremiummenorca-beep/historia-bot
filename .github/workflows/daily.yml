name: Publicar Short diario
on:
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar el video del dia
        env:
          TTS_ENGINE: eleven
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: "y6WtESLj18d0diFRruBs"
          ELEVEN_MODEL: eleven_flash_v2_5
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_I2V_MODEL: "fal-ai/kling-video/v2.5-turbo/pro/image-to-video"
          FAL_I2V_DURATION: "10"
          FAL_I2V_PROMPT: "cinematic, natural realistic movement, smooth dynamic camera, subjects moving and gesturing naturally, dramatic lighting, film look, high detail"
          VISUAL_MODE: aivideo
          AI_CLIPS: "4"
          EDGE_VOICE: es-ES-AlvaroNeural
          EDGE_RATE: "+0%"
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate.py
      - name: Subir a YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{
        
